name: 🐛 Bug Report
description: Create a bug report to help improve PlanCompareAI
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: ["eocecm1"]

body:
  - type: markdown
    attributes:
      value: |
        ## Thanks for reporting a bug! 🐛
        
        Please provide as much detail as possible to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Expected behavior...
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did this bug occur?
      options:
        - Production (plancompareai.onrender.com)
        - Local development
        - Both
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the application?
      options:
        - API endpoints
        - ChatKit integration
        - Database
        - Frontend/UI
        - Authentication
        - Deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Any relevant error messages or logs
      placeholder: Paste error logs here...

  - type: checkboxes
    id: copilot-analysis
    attributes:
      label: GitHub Copilot Analysis
      description: Would you like GitHub Copilot to analyze this issue?
      options:
        - label: Request Copilot code analysis
        - label: Request Copilot suggested fixes